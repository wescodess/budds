decisions_log:
  - ts: 2026-04-17
    decision: "Use opaque share token in URL path, not raw Convex id"
    rationale: "Raw ids enumerable; tokens are capability bearers — short-circuit the enumeration vector. 32-char hex via crypto.getRandomValues."
  - ts: 2026-04-17
    decision: "Public queries bypass auth but strip sensitive fields"
    rationale: "Share tokens are the authorization; returning userId/folderId/taskId would leak organization graph info. Whitelist only title+turns+sourceDocumentIds+voiceProfile."
  - ts: 2026-04-17
    decision: "Quota is a CLIENT-surfaced soft cap, not a server hard gate"
    rationale: "Matches plan §7 Phase 3 (soft cap) — protects against runaway LLM cost via UX but doesn't complicate the server auth/generation path. Hard gate can be added Phase 4+."
