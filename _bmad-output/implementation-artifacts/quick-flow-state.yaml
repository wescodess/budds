spec_slug: g4-chats-void-enhancements
input_type: goal
goal_or_spec: |
  G4: Chats void enhancements —
  (1) Render assistant responses via a markdown formatter (research best fit
  for this Nuxt project; ship as a reusable skill).
  (2) Show a 'thinking' indicator before the response starts streaming.
  (3) Inline citations in the bubble with a few reference chips below;
  'View all references' opens the helper section listing every citation+
  reference; hovering an inline citation shows a snippet + useful metadata.
  (4) Directory component — expandable folder tree (click a folder to reveal
  its subfolders and files with counts) that lets the user select any
  combination of folders / subfolders / individual files. Selection is passed
  to chat as reference scope: folder → all its files; file → just that file.
  Cover edge cases: empty folders, partial selection, mixed parent+child,
  large trees, loading, permission/access, deselect propagation.
