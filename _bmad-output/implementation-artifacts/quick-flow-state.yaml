decisions_log:
  - ts: 2026-04-17
    decision: "Synchronous server route (no task integration) for interjection generation"
    rationale: "Fixed overhead ~5-10s for 3 turns is acceptable blocking latency; avoids task-row bookkeeping for a short flow; UI shows a spinner with 8s safety net. Can be moved to tasks if latency becomes a complaint."
  - ts: 2026-04-17
    decision: "Reuse overview.voiceProfile for interjection TTS (no new voice picker)"
    rationale: "Consistency — the answer hosts should sound like the podcast hosts. Customizing voices per interjection adds UX friction without clear value."
  - ts: 2026-04-17
    decision: "Ask button on authenticated Player only; hidden on PublicAudioShell"
    rationale: "Public listeners are capability bearers, not authors — can't mutate the overview. Phase 3 established the auth-gated vs. read-only surface split."
