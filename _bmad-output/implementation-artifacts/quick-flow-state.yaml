goal_or_spec: |
  Audio Overview — Phase 2 Polish (per notebooklm_audio_overview_plan.md §7).
  Scope: (1) AudioOverviewCustomize dialog — pre-generation picker for lengthMinutes
  (5/10/20), complexity (beginner/expert), voiceProfile (host A/B). Wired to
  POST /api/audio-overview/generate body. (2) HostVisualizer — two pulsing orbs
  driven by Web Audio API AnalyserNode on the live <audio> element; active-speaker
  orb reacts to FFT magnitude, idle orb at low amplitude. Orbs are abstract amber/gold,
  not avatar headshots. (3) StickyMiniPlayer — single <audio> element in
  layouts/default.vue so playback survives folder navigation; Pinia store holds
  {overviewId, currentTurnIndex, currentTimeMs, isPlaying, speed}; collapsed bar shows
  play/pause + title + speaker chip + progress. Clicking expands back to full player.
  (4) Download — fetch all turn MP3s via getTurnUrls, decode via Web Audio API,
  re-encode to single MP3 via dynamic-imported lamejs, trigger <a download>.
  (5) Disabled-state cleanup: remove 'Soon' chips on Download + Customize entry,
  wire both to real actions.
  Out of scope (stays deferred): Phase 3 share link, Phase 4 interjection, quota,
  ffprobe durations, orphan blob cron, URL expiry proxy, AbortSignal.
  is_ui=true; design surfaces: AudioOverviewCustomize, HostVisualizer-on-Player,
  StickyMiniPlayer. Plan: notebooklm_audio_overview_plan.md §7 Phase 2.
  Preceding spec: _bmad-output/implementation-artifacts/spec-audio-overview-mvp.md.
  Target: new feature branch off dev.
