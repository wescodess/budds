goal_or_spec: |
  Audio Overview — Phase 4 Interjection (per notebooklm_audio_overview_plan.md §5.5 + §7).
  Owner pauses mid-playback, asks a follow-up (text or voice via SpeechRecognition),
  hosts answer inline (2-4 turns) then playback resumes. Scope: schema
  audioOverviewInterjections; POST /api/audio-overview/interject; Convex mutations
  create/listByOverview/deleteInterjection; store spliceTurns; InterjectModal;
  Player Ask button (auth-only, not public); tests for auth + splice + prompt.
  Out of scope: mobile Safari voice quirks, multi-language transcription.
