goal_or_spec: |
  Audio Overview — Phase 3 Share + Ops (per notebooklm_audio_overview_plan.md §7).
  Scope: (1) Public playback page at /audio/[token] with opaque token (not raw id),
  read-only Player variant. (2) Share modal from Player Share button (replaces Soon chip);
  Copy-link, Unshare, Create-link. (3) Schema: audioOverviews.shareToken? + publishedAt?
  + index; mutations publishOverview / unpublishOverview; public queries
  getByShareToken + getTurnUrlsByShareToken. (4) Per-user daily quota soft cap
  (users.audioOverviewQuota, getDailyQuota, 10/day default) surfaced at
  Customize-submit time. (5) Nitro cache rule on /audio/[token] to limit R2 egress.
  Out of scope: Phase 4 interjection, signed-URL TTL proxy, ffprobe durations.
