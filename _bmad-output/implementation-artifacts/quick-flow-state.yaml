goal_or_spec: |
  Refactor Budds flashcards from "folder-scoped generated set list" into a
  persistent flashcard ROOM model fitting the void-native workspace.
  Source: /Users/wesleyukadike/Desktop/budds/FLASHCARDSPLAN.md (committed at HEAD a4f7e77).

  Phase 1 scope:
  - Data: flashcardRooms, flashcardRoomCards, flashcardRoomVersions, flashcardVersionCards
  - Migration: each legacy flashcardSet → flashcardRoom + initial history version
  - Convex API: listRoomsByFolder, getRoom, createRoom, renameRoom, createCard,
    updateCard, deleteCard, reorderCards, generateRoomCards, listRoomVersions,
    restoreRoomVersion, deleteRoom
  - UI: flashcard voidId routes to rooms, FolderShellRail lists rooms,
    CreateVoidDialog creates empty room + routes, Tab becomes room shell with
    editor/practice mode switch + inline rename + sticky dock + history
    entrypoint + AI generation modal.
  - Editor mode: editable vertical list, add/delete/drag-reorder with
    optimistic UI + rollback, auto-create empty card on first entry.
  - Practice mode: flip, prev/next, shuffle, reset-flip on navigation.
  - History: secondary surface inside room; restore replaces current cards
    after confirm; entries immutable.

  Deferred: SM-2/SRS dashboard, standalone practice route, study-guide flashcards.
