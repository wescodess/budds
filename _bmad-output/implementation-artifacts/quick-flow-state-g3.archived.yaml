spec_slug: g3-folder-three-pane-revamp
input_type: goal
goal_or_spec: |
  G3: Folder page three-pane revamp — fixed (non-resizable) left rail with
  Members, Knowledge, and a folder-scoped voids list (Chats, Flashcards, Quiz);
  right-edge toggle opens a drawer (~55% width overlay) containing the folder
  hierarchy; main pane shows the active folder's files with per-file status
  chips and a hamburger menu for file options (rename/move/delete/etc.).

  SCOPE REFINEMENT (2026-04-14): Voids are dedicated interaction spaces (chat,
  flashcard, quiz) tied to their parent folder. A void can only be viewed
  inside its folder and inherits access to that folder's resources (members +
  knowledge). Creating a void from the left rail opens a masonry type-picker
  modal (styled like the dashboard block grid) for chat / flashcard / quiz.
  Data model: voids gain a folder_id FK; queries scope by folder.

  Must closely resemble
  docs/screenshots/Screenshot 2026-04-13 at 10.25.19 PM.png for the existing
  three-pane layout, plus a new Stitch-designed create-void masonry modal.
