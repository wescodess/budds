<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1917">
  <title>Budds</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
      background: #1c1917;
      color: #fafaf9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(245, 158, 11, 0.2), transparent 40%),
        #1c1917;
      padding: 24px;
    }

    main {
      width: min(100%, 420px);
      border: 1px solid rgba(250, 250, 249, 0.12);
      border-radius: 24px;
      background: rgba(41, 37, 36, 0.92);
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.5rem;
      line-height: 1.2;
    }

    p {
      margin: 0;
      color: #d6d3d1;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Budds is offline</h1>
    <p>Reconnect to keep studying, chatting, or opening your course folders.</p>
  </main>
</body>
</html>
