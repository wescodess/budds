[extend]
useDefault = true

[[allowlists]]
description = "Ignore generic-key false positives in removed workflow reference material retained in Git history"
targetRules = ["generic-api-key"]
paths = [
  '''(?:^|/)(?:\.agent|\.agents|\.cline|\.kiro|\.roo|_bmad)/(?:.*?/)?resources/knowledge/api-testing-patterns\.md$''',
  '''(?:^|/)_bmad/_config/files-manifest\.csv$''',
]

[[allowlists]]
description = "Ignore generic-key false positives in deterministic test and CI fixtures"
targetRules = ["generic-api-key"]
paths = [
  '''(?:^|/)convex/[^/]+\.test\.ts$''',
  '''(?:^|/)server/(?:api|utils)/.*\.test\.ts$''',
  '''(?:^|/)\.github/workflows/test\.yml$''',
]

[[allowlists]]
description = "Scorer corpus fixtures hold SHA-256 content digests, not credentials"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)tests/fixtures/learn-v2-scorer/(?:corpus|manifest)\.v1\.json$''']

[[allowlists]]
description = "Stitch identifiers are public design asset references, not credentials"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)stitch\.json$''']
