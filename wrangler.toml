name = "budds"
pages_build_output_dir = ".output/public/"
compatibility_date = "2025-04-14"
compatibility_flags = ["nodejs_compat"]

[secrets]
required = [
  "BETTER_AUTH_SECRET",
  "GOOGLE_CLIENT_SECRET",
  "CLOUDFLARE_AI_GATEWAY_API_KEY",
  "CLOUDFLARE_AI_SEARCH_TOKEN",
  "OPENROUTER_API_KEY",
  "R2_ACCESS_KEY_ID",
  "R2_SECRET_ACCESS_KEY",
]

# ── D1 Auth Database ─────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "budds-auth-db"
database_id = "ddb803e4-7d9d-471d-8a4b-4ccd69100bcf"

# ── R2 Object Storage ────────────────────────────────────────
[[r2_buckets]]
binding = "R2"
bucket_name = "budds"

# ── Non-secret environment variables ─────────────────────────
[vars]
NUXT_PUBLIC_SITE_URL = "https://budds.pages.dev"
