name = "budds"
compatibility_date = "2025-04-14"
compatibility_flags = ["nodejs_compat"]

# Local development only:
# - Do not add `pages_build_output_dir` here unless you want wrangler.toml to become
#   the source of truth for the Pages project's production/preview configuration.
# - Manage Pages Variables/Secrets and production bindings in the Cloudflare dashboard.

# ── D1 Auth Database ─────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "budds-auth-db"
database_id = "ddb803e4-7d9d-471d-8a4b-4ccd69100bcf"

# ── R2 Object Storage ────────────────────────────────────────
[[r2_buckets]]
binding = "R2"
bucket_name = "budds"
